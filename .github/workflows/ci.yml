name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the platform Dobby targets: the default codex binary
        # path is Homebrew's, and the child sandbox is Seatbelt. Linux stays in
        # the matrix because it is cheap and catches path assumptions early.
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        if: matrix.python-version == '3.12' && matrix.os == 'macos-latest'
        run: uv build

  test-latest-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Test against latest allowed dependencies
        # -o pythonpath= drops the repo's src/ from sys.path so this lane
        # imports the installed distribution rather than the source tree.
        # --no-cache because uv keys a `--with .` build on project.version: with
        # a warm cache it silently reuses an archive built from older source and
        # this lane then reports on code that is not in the tree.
        run: >-
          uv run --isolated --no-project --no-cache
          --with .
          --with pytest
          --with pytest-asyncio
          pytest -o pythonpath=

  live-codex-flags:
    # The one lane that talks to the real codex CLI. It exists because Dobby
    # passed --full-auto for years after codex-cli removed it: the unit tests
    # asserted the flag was emitted, only the real binary could say it was no
    # longer accepted. macos-latest because macOS is the platform Dobby targets.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install the latest codex CLI
        # @openai/codex is distributed on npm as a small JS shim that selects a
        # platform-native binary via optionalDependencies; the runner's
        # preinstalled Node satisfies its `node >= 16` requirement. The version
        # deliberately floats on the `latest` dist-tag, unlike everything else
        # in this file: the lane's entire purpose is to detect when a new codex
        # release changes the flag surface Dobby emits against, and pinning an
        # exact version would freeze the very drift it exists to catch.
        run: npm install -g @openai/codex@latest

      - name: Report the codex version under test
        # Fails the lane immediately if the install produced a broken binary,
        # and records which upstream version a red run was red against.
        run: codex --version

      - name: Run live flag tests
        # DOBBY_REQUIRE_LIVE=1 turns "codex missing => skip" into a hard
        # failure (tests/conftest.py), so a broken install can never masquerade
        # as a green lane. live_auth tests need real credentials and stay
        # local-only; everything else marked live runs here. If the marker
        # expression ever matches nothing, pytest exits 5 and the lane fails
        # rather than passing vacuously.
        env:
          DOBBY_REQUIRE_LIVE: "1"
        run: uv run pytest -m "live and not live_auth" -rs

  mutation-changed-lines:
    # Mutation-tests only the lines this PR changed: scripts/mutation_test.py
    # flips one executed comparison, boolean operator, `not`, or bool constant
    # at a time and some test must fail. A survivor that the recorded baseline
    # (scripts/mutation_baseline.json) does not excuse fails the job — the PR
    # must add a killing test or, for a provably equivalent mutant, a TODO.md
    # registry entry plus a baseline refresh. Pull requests only: a push to
    # main has no reviewable diff to attribute mutants to, and the scheduled
    # full sweep (mutation-sweep.yml) watches for drift there.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The incremental mode diffs against merge-base(origin/<base>, HEAD),
          # so the base branch's history must exist locally.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --group mutation

      - name: Install the latest codex CLI
        # The recorded mutation baseline is measured against the full suite,
        # live tests included, so this lane installs codex exactly as the
        # live-codex-flags lane does. Without it, a mutant whose only killer
        # is a live test would resurface here as a false "new survivor".
        run: npm install -g @openai/codex@latest

      - name: Report the codex version under test
        run: codex --version

      - name: Mutation-test the changed lines
        # DOBBY_REQUIRE_LIVE=1 turns a missing or broken codex into a loud
        # baseline failure (exit 2) instead of silently skipped live tests
        # that would misreport live-killed mutants as survivors.
        env:
          DOBBY_REQUIRE_LIVE: "1"
        run: >-
          uv run python scripts/mutation_test.py sweep
          --since "origin/${{ github.base_ref }}" --check

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Lint
        run: uvx ruff check src tests scripts
