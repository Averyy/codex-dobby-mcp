[project]
name = "codex-dobby-mcp"
version = "0.1.4"
description = "Local stdio MCP delegation server that routes Claude-orchestrated tasks through codex exec"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Avery Levitt", email = "avery23@gmail.com" }
]
keywords = ["mcp", "codex", "claude", "automation", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/Averyy/codex-dobby-mcp"
Repository = "https://github.com/Averyy/codex-dobby-mcp"
Issues = "https://github.com/Averyy/codex-dobby-mcp/issues"

[project.scripts]
codex-dobby-mcp = "codex_dobby_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Deliberately narrow: the rules that catch real defects (undefined names,
# unused locals like the F841 that hid a dropped parse, mutable default args,
# broken except clauses) rather than whole-repo restyling. Widen this set in a
# dedicated change, not alongside behaviour work.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers: a typo'd marker must be a collection error, not a test
# that silently drops out of the CI live lane's `-m` selection.
addopts = ["--strict-markers"]
markers = [
    "live: tests that exercise the real codex CLI; skipped when it is absent unless DOBBY_REQUIRE_LIVE=1 makes that a failure",
    "live_auth: live tests that additionally need an authenticated Codex CLI; opt in with CODEX_DOBBY_RUN_LIVE_V2=1, never run in CI",
]

[tool.uv.build-backend]
source-include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "scripts/**",
    "tests/**",
]
